modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
A foundation for a more inhabited Minecraft world: travelers, communities, and places to discover.
Includes ambient travelers, a campfire gathering with a lute musician, and a shoreline fisher with their sitting cat, and a traveler riding a vanilla boat. Settlements are planned.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
